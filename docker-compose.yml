services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: local-llm-server

    ports:
      - "8080:8080"

    volumes:
      - ./models:/models:ro

    command:
      - "-m"
      - "/models/Qwen3-8B-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "8192"